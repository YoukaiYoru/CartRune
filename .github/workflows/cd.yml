name: CartRune CD

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "apps/deploy/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cartrune-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/cartrune-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Go vet
        working-directory: apps/api
        run: go vet ./...
      - name: Go tests
        working-directory: apps/api
        run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare VM deployment directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -eu
            sudo install -d -m 0750 -o "$(id -un)" -g "$(id -gn)" /opt/cartrune
      - name: Copy production files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "apps/deploy/compose.production.yml,apps/deploy/Caddyfile"
          target: /opt/cartrune
          strip_components: 2
      - name: Pull and restart API
        uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          CARTRUNE_ENV_API: ${{ secrets.CARTRUNE_ENV_API }}
          CARTRUNE_DOMAIN: api-cartrune.duckdns.org
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          envs: API_IMAGE,GHCR_TOKEN,GHCR_USER,CARTRUNE_ENV_API,CARTRUNE_DOMAIN
          script: |
            set -eu
            cd /opt/cartrune
            test -n "$CARTRUNE_ENV_API"
            umask 077
            printf '%s\n' "$CARTRUNE_ENV_API" > .env.api
            jwt_length="$(awk -F= '$1 == "JWT_SECRET" {print length($2); exit}' .env.api)"
            test "${jwt_length:-0}" -ge 32
            grep -Eq '^CORS_ORIGINS=https?://' .env.api
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            export API_IMAGE CARTRUNE_DOMAIN
            docker compose -f compose.production.yml pull
            if ! docker compose -f compose.production.yml up -d --remove-orphans; then
              docker compose -f compose.production.yml ps
              docker compose -f compose.production.yml logs --tail=100 api caddy
              exit 1
            fi
            docker compose -f compose.production.yml ps
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent "https://${CARTRUNE_DOMAIN}/health/live" >/dev/null; then exit 0; fi
              sleep 10
            done
            docker compose -f compose.production.yml logs --tail=100 api caddy
            exit 1
