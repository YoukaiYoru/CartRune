name: CartRune Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cartrune-terraform
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_source_cidr: ${{ secrets.TF_VAR_ADMIN_SOURCE_CIDR }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=cartrune.production.tfstate" -backend-config="use_azuread_auth=true"
      - name: Terraform format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -no-color -out=tfplan

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_source_cidr: ${{ secrets.TF_VAR_ADMIN_SOURCE_CIDR }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=cartrune.production.tfstate" -backend-config="use_azuread_auth=true"
      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve
