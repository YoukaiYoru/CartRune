name: CartRune Terraform (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar la infraestructura de Azure después del plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: cartrune-terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_source_cidr: ${{ secrets.TF_VAR_ADMIN_SOURCE_CIDR }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
          ADMIN_SOURCE_CIDR: ${{ secrets.TF_VAR_ADMIN_SOURCE_CIDR }}
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$TFSTATE_RESOURCE_GROUP"
          test -n "$TFSTATE_STORAGE_ACCOUNT"
          test -n "$ADMIN_SSH_PUBLIC_KEY"
          test -n "$ADMIN_SOURCE_CIDR"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=cartrune.production.tfstate" -backend-config="use_azuread_auth=true"
      - name: Terraform format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Upload reviewed plan
        uses: actions/upload-artifact@v4
        with:
          name: cartrune-terraform-plan-${{ github.run_id }}
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform apply
    if: inputs.apply == true
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_source_cidr: ${{ secrets.TF_VAR_ADMIN_SOURCE_CIDR }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=cartrune.production.tfstate" -backend-config="use_azuread_auth=true"
      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: cartrune-terraform-plan-${{ github.run_id }}
          path: infra/terraform
      - name: Apply reviewed plan
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan
