services:
  embeddings:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/youkaiyoru/cartrune-embeddings:latest}
    restart: unless-stopped
    env_file:
      - .env.embeddings
    expose:
      - "8700"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  api:
    image: ${API_IMAGE:-ghcr.io/youkaiyoru/cartrune-api:latest}
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      EMBEDDINGS_URL: http://embeddings:8700
    depends_on:
      embeddings:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - /opt/cartrune/certs:/run/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
