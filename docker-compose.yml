services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: "8080"
      DB_SSLMODE: require
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-45s}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

# Supabase provides PostgreSQL. This Compose file does not create a database.
