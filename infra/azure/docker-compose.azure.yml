services:
  api:
    build:
      context: ../../apps/api
    container_name: cartrune-api
    restart: unless-stopped
    env_file:
      - .env.azure
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"
      TLS_TERMINATED: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: cartrune-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CARTRUNE_DOMAIN: ${CARTRUNE_DOMAIN:-api-cartrune.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
